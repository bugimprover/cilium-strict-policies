---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "infra-allow-vip-api"
spec:
  nodeSelector: {}
  ingress:
  - fromCIDR:
    - "192.168.4.190/32"
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
      - port: '10250'
        protocol: TCP
  
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: api-server-allow
  labels:
    k8s-app: kube-apiserver
    tier: system
spec:
  nodeSelector: {}
  ingress:
  - fromEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '10250'
        protocol: TCP
  egress:
  - toEntities:
    - remote-node
    - kube-apiserver
    toPorts:
    - ports:
      - port: '2380'
        protocol: TCP
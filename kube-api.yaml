---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "vip-kubeapi-allow"
  labels:
    k8s-app: kubeapi
    tier: cluster
spec:
  nodeSelector: {}
  ingress:
    - fromCIDR:
        - "192.168.4.0/24"
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
            - port: '10250'
              protocol: TCP
  egress:
    - toCIDR:
        - "192.168.4.0/24"
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
  


---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: kubeapi-server-allow
  labels:
    k8s-app: kubeapi
    tier: cluster
spec:
  nodeSelector: {}
  ingress:
    - fromEntities:
        - cluster
        - world
        - remote-node ## just for test
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "10250"
              protocol: TCP
  egress:
    - toEntities:
        - remote-node
        - kube-apiserver
        - world
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "10250"
              protocol: TCP

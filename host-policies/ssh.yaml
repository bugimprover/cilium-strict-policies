---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ssh-host-allow"
  labels:
    k8s-app: ssh
    tier: system
spec:
  nodeSelector: {}
  ingress:
    - fromEntities:
        - world
        - kube-apiserver # only for ssh forwarding
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
  egress:
    - toEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "coredns-53-allow"
spec:
  nodeSelector: {}
  egress:
    - toEntities:
      - world
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY

---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "coredns-test-allow"
spec:
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
      k8s:io.kubernetes.pod.namespace: kube-system
  egress:
    - toEntities:
      - world
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY

---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "coredns-kube-system-allow"
spec:
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
      k8s:io.kubernetes.pod.namespace: kube-system
  ingress:
    - fromEndpoints: []
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY

---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "coredns-probes-allow"
spec:
  nodeSelector: {}
  egress:
    - toEndpoints:
      - matchLabels:
          k8s-app: kube-dns
          k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
      - ports:
        - port: "8080"
          protocol: TCP
      - ports:
        - port: "8181"
          protocol: TCP
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "hubble-hosts-allow"
spec:
  endpointSelector:
    matchLabels:
      k8s-app: hubble-relay
      k8s:io.kubernetes.pod.namespace: kube-system
  egress:
  - toEntities:
    - kube-apiserver
    - remote-node
    toPorts:
    - ports:
      - port: '4244'
        protocol: TCP





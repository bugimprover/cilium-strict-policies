---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "hubble-pods-allow"
spec:
  nodeSelector: {}
  egress:
    - toEndpoints:
      - matchLabels:
          k8s-app: hubble-relay
          k8s:io.kubernetes.pod.namespace: kube-system
      - matchLabels:
          k8s-app: hubble-ui
          k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
      - ports:
        - port: "4222"
          protocol: TCP
      - ports:
        - port: "8081"
          protocol: TCP

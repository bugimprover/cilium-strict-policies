# Special rule for cilium-health ICMP probes (remote-node → health-endpoint).
# Host firewall (nodeSelector) doesn't always match health identity correctly,
# so we use endpointSelector:{} to target the health endpoint directly.
# See Cilium docs: health endpoints use reserved identity 'health'.
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: infra-allow-cluster-icmp-v4
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - remote-node
      icmps:
        - fields:
            - type: 8
              family: IPv4
            - type: 0
              family: IPv4

---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: infra-allow-nodes-icmp-v4
spec:
  nodeSelector: {}
  ingress:
    - fromEntities:
        - remote-node
        - host
      icmps:
        - fields:
            - type: 8
              family: IPv4
            - type: 0
              family: IPv4
  egress:
    - toEntities:
        - remote-node
        - host
        - health
      icmps:
        - fields:
            - type: 8
              family: IPv4
            - type: 0
              family: IPv4